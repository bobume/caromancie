<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier Caromancie</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>

<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Atelier local</p>
      <h1>Caromancie</h1>
    </div>
    <div class="topbar-actions">
      <a class="ghost-button" href="/preview" target="_blank" rel="noreferrer">Voir le site</a>
      <button class="ghost-button" id="publishButton" type="button">Mettre en ligne</button>
      <button class="primary-button" id="saveButton" type="button">Enregistrer</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar" aria-label="Sections">
      <button class="section-tab is-active" type="button" data-section="hero">
        <span>Bandeau</span>
        <small>Titre, textes, image</small>
      </button>
      <button class="section-tab" type="button" data-section="philosophy">
        <span>Approche</span>
        <small>Cartes de contenu</small>
      </button>
      <button class="section-tab" type="button" data-section="contact">
        <span>Contact</span>
        <small>Appel à l'échange</small>
      </button>
      <button class="section-tab" type="button" data-section="settings">
        <span>Réglages</span>
        <small>Nom, titre, pied de page</small>
      </button>
    </aside>

    <section class="editor" aria-label="Éditeur">
      <div class="editor-heading">
        <div>
          <p class="eyebrow">Modification</p>
          <h2 id="editorTitle">Bandeau</h2>
        </div>
        <p class="save-state" id="saveState">Prêt</p>
      </div>
      <form id="editorForm"></form>
    </section>

    <section class="preview-panel" aria-label="Aperçu">
      <div class="preview-heading">
        <div>
          <p class="eyebrow">Aperçu</p>
          <h2>Site public</h2>
        </div>
        <button class="ghost-button compact" id="refreshPreview" type="button">Rafraîchir</button>
      </div>
      <iframe id="previewFrame" title="Aperçu du site Caromancie" src="/preview"></iframe>
    </section>
  </main>

  <script src="/admin/admin.js"></script>
</body>

</html>
