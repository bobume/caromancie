name: Optimiser images

on:
  push:
    paths:
      - 'public/images/**'
      - 'scripts/optimiser_images.py'
      - 'requirements.txt'
      - '.github/workflows/optimiser-images.yml'
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Filter changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: 'csv'
          filters: |
            images:
              - 'public/images/**'
              - '!public/images/mobile/**'
              - '!public/images/desktop/**'

      - name: Run image optimizer
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python scripts/optimiser_images.py
          elif [[ "${{ steps.filter.outputs.images }}" == "true" ]]; then
            printf "%s" "${{ steps.filter.outputs.images_files }}" > /tmp/changed_files.txt
            python scripts/optimiser_images.py --files "$(cat /tmp/changed_files.txt)"
          fi

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images || true
          git diff --staged --quiet || (git commit -m "Auto-optimize images: generate WebP versions" && git push)
